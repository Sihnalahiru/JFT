<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <meta
    name="description"
    content="IRODORI Master — Japanese learning PWA"
  >

  <title>IRODORI Master</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

  <div id="app">

    <header class="app-header">
      <div class="app-brand">
        <h1>IRODORI Master</h1>
        <p>Japanese Learning System</p>
      </div>
    </header>

    <main id="main-content">

      <section id="home-screen" class="screen">

        <div class="welcome-card">
          <h2>Welcome to IRODORI Master</h2>

          <p>
            Learn Japanese through the official IRODORI
            learning materials.
          </p>
        </div>

        <div id="book-list" class="book-list">
          <p class="loading">
            Loading learning data...
          </p>
        </div>

      </section>

    </main>

    <footer class="app-footer">
      <p>
        IRODORI Master
      </p>
    </footer>

  </div>

  <script
    src="js/app.js"
    defer
  ></script>

</body>
</html>
